<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thcoku — Discord Activity</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="boot">
      <p id="boot-status">Connecting to Discord…</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <main id="app">
      <div id="resume" hidden>
        <p id="resume-copy">You've got a puzzle in progress.</p>
        <div class="resume-actions">
          <button type="button" id="resume-continue">Resume</button>
          <button type="button" id="resume-new">New puzzle</button>
        </div>
      </div>
      <div id="game-shell">
        <div id="game-board-stack">
          <div id="app-toolbar" aria-label="Game settings">
            <button
              type="button"
              id="watchers-chip"
              hidden
              aria-live="polite"
              aria-expanded="false"
              title="People watching your game"
            >
              <span id="watchers-chip-label">👀</span>
            </button>
            <button type="button" id="music-toggle" title="Música: Clownfish Capers" aria-label="Música" aria-pressed="false">🔕</button>
            <button type="button" id="sfx-toggle" title="Sons do jogo" aria-label="Sons" aria-pressed="false">🔊</button>
            <button type="button" id="theme-toggle" title="Toggle theme">🌙</button>
          </div>
          <canvas id="canvas" width="720" height="980"></canvas>
          <p id="game-hint">Cooking up a Sudoku…</p>
        </div>
      </div>
      <div id="win-toast" hidden></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
